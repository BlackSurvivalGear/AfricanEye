name: Vendor AfricanEye Intelligence Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/africaneye-osint-frontend'
    paths:
      - 'scripts/vendor-africaneye-intelligence.mjs'
      - '.github/workflows/vendor-africaneye-intelligence.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AfricanEye
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor AfrOsint frontend
        run: node scripts/vendor-africaneye-intelligence.mjs

      - name: Verify frontend-only boundary
        shell: bash
        run: |
          if grep -RniE 'firebase|firestore|firebase-auth|firebase-storage|afrosint-auth|authLoadingScreen|login/js/permissions' assets/africaneye-intelligence --exclude='*.map' 2>/dev/null; then
            echo 'Backend/auth references remain in vendored frontend.'
            exit 1
          fi
          if grep -RniE 'AfrOsint|AFROSINT|afrosint' assets/africaneye-intelligence --exclude='*.map' 2>/dev/null; then
            echo 'AfrOsint branding references remain in vendored frontend.'
            exit 1
          fi

      - name: Commit vendored frontend
        run: |
          git config user.name 'AfricanEye Vendor Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/africaneye-intelligence
          if git diff --cached --quiet; then
            echo 'No vendor changes.'
          else
            git commit -m 'build: vendor AfricanEye intelligence frontend'
            git push
          fi
