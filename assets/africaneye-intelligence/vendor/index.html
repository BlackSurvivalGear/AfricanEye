<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>AfricanEye Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
<div id="mainAppContainer">
<div class="watermark-bg"></div>
<div id='proverbBanner'><div id='bannerBtns'><button class='banner-text-btn' onclick='toggleSharePanel()'>SHARE</button></div><span id='proverbText'></span></div>
<header id='commandHeader'>
<div class='header-left'><div class='brand-wrap'><img src="assets/images/africaneye-logo.svg" alt="AfricanEye Logo" class="header-logo"><div><div class='callsign'>AfricanEye</div><div class='subline'>Pan-African Intelligence</div></div></div></div>
<div class='header-right'></div>
<div class='header-center-wrap'>
<div id='navBtns'><button id='afrMapBtn' class='command-btn'>AfricanEye Map</button><button id='headlinesBtn' class='command-btn'>Headlines</button><button id='newsBtn' class='command-btn'>News Wall</button><button id='marketsBtn' class='command-btn'>Markets</button><button id='fxBtn' class='command-btn'>FX</button><button id='radioBtn' class='command-btn'>Radio</button><button id='commsBtn' class='command-btn'>Discord</button></div>
<div class='clock-section'><div id='gmtClock' onclick='toggleAfricaTime()'></div><div id='gmtClockFlag' onclick='toggleAfricaTime()' style='text-align:center;font-size:28px;line-height:1;display:none;cursor:pointer'></div><div id='setCountryBtn'><button class='set-btn' onclick='toggleAfricaTime()'>SET</button></div></div>
<div id='africaTimePanel' onmouseenter='clearAfricaTimeHide()' onmouseleave='scheduleAfricaTimeHide()' ontouchstart='clearAfricaTimeHide()'><div id='africaTimeWidget'><h2>African Time</h2><div class='atw-toggle-container'><input id='atwSearchBox' type='text' placeholder='Search country or capital...' autocomplete='off' /><select id='atwHourFormat' style='width:auto'><option value='auto'>Auto Format</option><option value='12'>12-hour</option><option value='24'>24-hour</option></select><button class='atw-small-button' id='atwResetGmt' onclick="setHeaderTime(null,'','')">RESET TO GMT</button></div><select id='atwCountrySelect'><option value=''>Jump to country...</option></select><div class='atw-grid' id='atwCityGrid'></div></div></div>
<div id='sharePanel'><h2>SHARE PLATFORM</h2><div class='share-grid'><a id='shareX' href='#' target='_blank' class='atw-small-button share-link'>X / TWITTER</a><a id='shareFB' href='#' target='_blank' class='atw-small-button share-link'>FACEBOOK</a><a id='shareLI' href='#' target='_blank' class='atw-small-button share-link'>LINKEDIN</a><a id='shareWA' href='#' target='_blank' class='atw-small-button share-link'>WHATSAPP</a></div><button class='donate-copy-btn' onclick='copyShareLink()' id='shareCopyBtn' style='width:100%'>COPY LINK</button></div>
